<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    .dashboard {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      gap: 10px;
      min-height: 300px;
    }
    .header  { grid-area: header;  background: #ffd6a5; padding: 16px; }
    .sidebar { grid-area: sidebar; background: #caffbf; padding: 16px; }
    .main    { grid-area: main;    background: #9bf6ff; padding: 16px; }
    .footer  { grid-area: footer;  background: #ffc6ff; padding: 16px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="main">Main</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>
